spring.application.name=safevision

# JWT (RSA Keys)
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key

# Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/safevision_db
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# CORS
safevision.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173,http://10.0.0.141:5173,http://172.20.176.1:5173,http://172.26.144.1:5173

# Upload de evidencias
# Pasta onde o Python salva os .jpg de infrações
safevision.evidencias.path=C:/Users/Pichau/Downloads/Projeto_A3(original)/evidencias

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
